<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>KunYu Studio · 启动动画原型 v2</title>
<style>
  :root {
    --bg: #070a12;
    --accent: #2979ff;
    --accent-soft: #5aa2ff;
    --cycle: 9.6s;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: var(--bg); overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }

  .stage {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background:
      radial-gradient(70vmax 46vmax at 50% 44%, rgba(41, 121, 255, .16), transparent 62%),
      linear-gradient(180deg, #080b14 0%, #0a0f1c 55%, #070a12 100%);
  }

  /* ============ 第一幕：品牌亮相 ============ */
  .act { position: absolute; inset: 0; }
  .act1 {
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    animation: act1Vis var(--cycle) linear infinite;
    z-index: 2;
  }
  .act1 .grid {
    position: absolute;
    inset: -20%;
    background-image:
      linear-gradient(rgba(120, 170, 255, .045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(120, 170, 255, .045) 1px, transparent 1px);
    background-size: 64px 64px;
    mask-image: radial-gradient(60vmax 40vmax at 50% 45%, #fff 0%, transparent 78%);
    -webkit-mask-image: radial-gradient(60vmax 40vmax at 50% 45%, #fff 0%, transparent 78%);
    animation: gridDrift 3.2s ease-in-out infinite;
  }
  .beam {
    position: absolute;
    top: -20%;
    height: 140%;
    width: 46%;
    filter: blur(22px);
    transform: skewX(-16deg);
    pointer-events: none;
  }
  .beam-l {
    left: -30%;
    background: linear-gradient(90deg, transparent, rgba(90, 162, 255, .17) 55%, transparent);
    animation: beamL var(--cycle) ease-in-out infinite;
  }
  .beam-r {
    right: -30%;
    background: linear-gradient(90deg, transparent, rgba(90, 162, 255, .13) 45%, transparent);
    animation: beamR var(--cycle) ease-in-out infinite;
  }

  .center {
    position: relative;
    z-index: 3;
    display: flex;
    flex-direction: column;
    align-items: center;
    transform: translateY(-2.5vmin);
  }

  .emblem {
    position: relative;
    width: min(60vmin, 300px);
    height: min(60vmin, 300px);
    display: grid;
    place-items: center;
    animation: emblemIn var(--cycle) cubic-bezier(.22, .75, .3, 1) infinite;
    filter: drop-shadow(0 0 40px rgba(41, 121, 255, .45));
  }
  .emblem-glow {
    position: absolute;
    inset: -18%;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(64, 142, 255, .5) 0%, rgba(41, 121, 255, .2) 44%, transparent 70%);
    filter: blur(14px);
    animation: glowPulse var(--cycle) ease-in-out infinite;
    pointer-events: none;
  }
  .ring {
    position: absolute;
    inset: 8%;
    border: 1.5px solid rgba(122, 176, 255, .5);
    border-radius: 50%;
    opacity: 0;
    pointer-events: none;
  }
  .ring-1 { animation: ringOut var(--cycle) cubic-bezier(.2, .7, .3, 1) infinite; }
  .ring-2 { animation: ringOut2 var(--cycle) cubic-bezier(.2, .7, .3, 1) infinite; }

  .mark {
    position: relative;
    display: block;
    width: 100%;
    height: 100%;
    animation: markIn var(--cycle) cubic-bezier(.2, .7, .25, 1) infinite;
    will-change: transform, opacity, filter;
  }
  .mark-shine { position: absolute; inset: 0; border-radius: 40%; overflow: hidden; pointer-events: none; }
  .mark-shine::after {
    content: "";
    position: absolute;
    top: -60%;
    left: -80%;
    width: 42%;
    height: 220%;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .5), transparent);
    transform: rotate(18deg);
    animation: shineSweep var(--cycle) ease-in-out infinite;
    mix-blend-mode: screen;
  }

  .wordmark {
    margin-top: 5.5vmin;
    overflow: hidden;
    padding: .12em .2em;
    animation: wordReveal var(--cycle) cubic-bezier(.25, .8, .3, 1) infinite;
  }
  .wm-text {
    display: inline-block;
    font-size: clamp(26px, 7vmin, 62px);
    font-weight: 650;
    letter-spacing: .05em;
    color: #fff;
    background: linear-gradient(100deg, #ffffff 28%, #d3e3ff 44%, #ffffff 62%);
    background-size: 260% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: sheen var(--cycle) ease-in-out infinite;
    filter: drop-shadow(0 0 22px rgba(88, 150, 255, .32));
  }
  .tagline {
    margin-top: 2.4vmin;
    font-size: clamp(9px, 1.55vmin, 13px);
    letter-spacing: .44em;
    text-indent: .44em;
    color: rgba(168, 200, 255, .58);
    text-transform: uppercase;
    white-space: nowrap;
    animation: taglineIn var(--cycle) ease-out infinite;
  }
  .underline {
    margin-top: 2.6vmin;
    width: min(52vmin, 300px);
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--accent) 30%, #9dc4ff 50%, var(--accent) 70%, transparent);
    transform: scaleX(0);
    opacity: 0;
    animation: underlineIn var(--cycle) cubic-bezier(.2, .8, .3, 1) infinite;
  }

  /* 启动日志：淡入的左下角终端感小字 */
  .bootlog {
    position: absolute;
    left: calc(22px + env(safe-area-inset-left));
    bottom: calc(54px + env(safe-area-inset-bottom));
    display: flex;
    flex-direction: column;
    gap: 6px;
    font-family: "Cascadia Mono", "SF Mono", Consolas, ui-monospace, monospace;
    font-size: 11px;
    letter-spacing: .06em;
    color: rgba(122, 168, 235, .55);
    pointer-events: none;
  }
  .bootlog div { opacity: 0; animation: logIn var(--cycle) linear infinite; }
  .bootlog div:nth-child(1) { animation-name: logIn1; }
  .bootlog div:nth-child(2) { animation-name: logIn2; }
  .bootlog div:nth-child(3) { animation-name: logIn3; }

  /* ============ 第二幕：方块世界 ============ */
  .act2 {
    opacity: 0;
    animation: act2Vis var(--cycle) linear infinite;
    z-index: 3;
    overflow: hidden;
    background:
      radial-gradient(90vmax 60vmax at 50% 58%, rgba(41, 121, 255, .22), transparent 66%),
      radial-gradient(50vmax 30vmax at 78% 22%, rgba(190, 70, 255, .14), transparent 70%),
      linear-gradient(180deg, #06080f, #0a0f1d 45%, #05070d);
  }
  .cyber-floor {
    position: absolute;
    left: -60%;
    right: -60%;
    bottom: 0;
    height: 140%;
    transform: perspective(600px) rotateX(60deg);
    transform-origin: 50% 100%;
    background-color: rgba(41, 121, 255, .16);
    background-image:
      linear-gradient(rgba(96, 164, 255, .8) 2px, transparent 2px),
      linear-gradient(90deg, rgba(96, 164, 255, .8) 2px, transparent 2px);
    background-size: 64px 64px, 64px 64px;
    mask-image: linear-gradient(180deg, transparent 0%, rgba(0, 0, 0, .5) 10%, #000 38%);
    -webkit-mask-image: linear-gradient(180deg, transparent 0%, rgba(0, 0, 0, .5) 10%, #000 38%);
    animation: floorScroll 1.8s linear infinite;
    opacity: .95;
    pointer-events: none;
  }
  .cyber-horizon {
    position: absolute;
    left: 0;
    right: 0;
    top: 60%;
    height: 150px;
    transform: translateY(-50%);
    background: radial-gradient(48% 100% at 50% 50%, rgba(41, 121, 255, .5), transparent 72%);
    filter: blur(18px);
    pointer-events: none;
  }
  .sweep {
    position: absolute;
    left: -10%;
    right: -10%;
    top: 0;
    height: 26vh;
    background: linear-gradient(180deg, transparent, rgba(120, 180, 255, .16) 45%, rgba(160, 210, 255, .3) 55%, transparent);
    filter: blur(8px);
    animation: sweepDown var(--cycle) ease-in-out infinite;
    pointer-events: none;
  }
  .cubes { position: absolute; inset: 0; pointer-events: none; }
  .cube {
    position: absolute;
    top: -14%;
    width: var(--s);
    height: var(--s);
    border: 1px solid rgba(170, 214, 255, .75);
    background:
      linear-gradient(135deg, rgba(140, 195, 255, .72) 0%, rgba(41, 121, 255, .16) 60%),
      repeating-linear-gradient(90deg, rgba(255, 255, 255, .1) 0 2px, transparent 2px 6px);
    box-shadow: 0 0 20px rgba(41, 121, 255, .6), inset 0 0 12px rgba(90, 162, 255, .3);
    animation: cubeFall var(--d) linear var(--delay) infinite;
    will-change: transform;
  }
  .cube.is-warm { border-color: rgba(255, 168, 168, .3); box-shadow: 0 0 16px rgba(255, 90, 90, .22); }

  .bigline {
    position: absolute;
    left: 0;
    right: 0;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    justify-content: center;
    z-index: 4;
    padding: 0 4vw;
    overflow: hidden;
  }
  .bigline span {
    display: block;
    white-space: nowrap;
    font-size: clamp(34px, 9vw, 148px);
    font-weight: 800;
    letter-spacing: .05em;
    color: #fff;
    text-shadow: 0 0 26px rgba(41, 121, 255, .55), 0 0 70px rgba(41, 121, 255, .3);
    clip-path: inset(0 100% 0 0);
    animation: bigIn var(--cycle) cubic-bezier(.2, .8, .3, 1) infinite;
  }
  .bigline::before {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(40% 120% at 50% 50%, rgba(41, 121, 255, .28), transparent 70%);
    filter: blur(18px);
    animation: bigGlow var(--cycle) ease-in-out infinite;
    pointer-events: none;
  }

  .neon-line {
    position: absolute;
    left: 8%;
    right: 8%;
    top: calc(50% + clamp(52px, 7vw, 100px));
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--accent) 30%, #bfe0ff 50%, var(--accent) 70%, transparent);
    box-shadow: 0 0 22px rgba(41, 121, 255, .75);
    transform: scaleX(0);
    animation: neonIn var(--cycle) cubic-bezier(.2, .8, .3, 1) infinite;
  }

  .scanlines {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: repeating-linear-gradient(180deg, rgba(140, 190, 255, .07) 0 1px, transparent 1px 3px);
    opacity: .55;
    mix-blend-mode: screen;
  }
  .act2 .vignette {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(72% 62% at 50% 46%, transparent 52%, rgba(0, 0, 0, .78) 100%);
  }

  /* ============ 全局 ============ */
  .progress {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 2px;
    transform-origin: left center;
    background: linear-gradient(90deg, rgba(41, 121, 255, .1), var(--accent-soft), rgba(41, 121, 255, .1));
    box-shadow: 0 0 14px rgba(41, 121, 255, .55);
    opacity: 0;
    animation: progressIn var(--cycle) linear infinite;
    z-index: 6;
  }
  .fadeout {
    position: absolute;
    inset: 0;
    background: #05070d;
    opacity: 0;
    pointer-events: none;
    animation: fadeOut var(--cycle) ease-in infinite;
    z-index: 7;
  }

  .hint {
    position: absolute;
    left: 50%;
    bottom: calc(18px + env(safe-area-inset-bottom));
    transform: translateX(-50%);
    z-index: 8;
    font-size: 12px;
    letter-spacing: .08em;
    color: rgba(190, 210, 245, .45);
    white-space: nowrap;
    transition: opacity 1.2s ease;
  }
  .hint.is-hidden { opacity: 0; }
  .hud {
    position: absolute;
    top: calc(14px + env(safe-area-inset-top));
    right: calc(14px + env(safe-area-inset-right));
    z-index: 8;
    display: flex;
    gap: 8px;
  }
  .hud button {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: 1px solid rgba(140, 175, 235, .28);
    background: rgba(20, 30, 50, .5);
    color: rgba(200, 220, 255, .72);
    font-size: 14px;
    line-height: 1;
    cursor: pointer;
  }

  /* 静态定帧（截图核对用） */
  .static-mode * { animation: none !important; }
  .static-mode .act1, .static-mode .act2 { opacity: 0; }
  .static-mode.show-act1 .act1 { opacity: 1; }
  .static-mode.show-act2 .act2 { opacity: 1; }
  .static-mode.show-act2 .bigline span { clip-path: inset(0 0 0 0); }
  .static-mode.show-act2 .neon-line { transform: scaleX(1); }
  .static-mode .progress, .static-mode .fadeout { display: none; }
  .static-mode .hint, .static-mode .hud { opacity: .35; }
  .static-mode .bootlog div { opacity: 1; }
  .static-mode.show-act2 .cube { top: var(--st, 20%); opacity: var(--o); }

  /* ============ Keyframes ============ */
  @keyframes act1Vis {
    0%, 2% { opacity: 0; }
    6%, 28% { opacity: 1; }
    34%, 100% { opacity: 0; }
  }
  @keyframes act2Vis {
    0%, 24% { opacity: 0; }
    32%, 64% { opacity: 1; }
    70%, 100% { opacity: 0; }
  }
  @keyframes markIn {
    0%, 1% { opacity: 0; transform: scale(.86); filter: blur(18px) brightness(.55); }
    13% { opacity: 1; transform: scale(1.05); filter: blur(0) brightness(1.22); }
    16%, 30% { opacity: 1; transform: scale(1); filter: blur(0) brightness(1); }
    100% { opacity: 0; transform: scale(1); filter: blur(0) brightness(1); }
  }
  @keyframes emblemIn {
    0%, 1% { opacity: 0; transform: scale(.94); }
    9%, 100% { opacity: 1; transform: scale(1); }
  }
  @keyframes glowPulse {
    0% { opacity: 0; transform: scale(.7); }
    10% { opacity: 1; transform: scale(1.05); }
    22% { opacity: .62; transform: scale(.98); }
    30% { opacity: .5; transform: scale(1); }
    100% { opacity: 0; transform: scale(1); }
  }
  @keyframes ringOut {
    0%, 6% { opacity: 0; transform: scale(.45); }
    9% { opacity: .7; }
    17% { opacity: 0; transform: scale(2.35); }
    100% { opacity: 0; transform: scale(2.35); }
  }
  @keyframes ringOut2 {
    0%, 8% { opacity: 0; transform: scale(.4); }
    11% { opacity: .5; }
    20% { opacity: 0; transform: scale(2.7); }
    100% { opacity: 0; transform: scale(2.7); }
  }
  @keyframes beamL {
    0%, 3% { opacity: 0; transform: translateX(-18%) skewX(-16deg); }
    8% { opacity: 1; }
    16% { opacity: 0; transform: translateX(72%) skewX(-16deg); }
    100% { opacity: 0; transform: translateX(72%) skewX(-16deg); }
  }
  @keyframes beamR {
    0%, 4% { opacity: 0; transform: translateX(18%) skewX(-16deg); }
    10% { opacity: .85; }
    18% { opacity: 0; transform: translateX(-72%) skewX(-16deg); }
    100% { opacity: 0; transform: translateX(-72%) skewX(-16deg); }
  }
  @keyframes gridDrift {
    0%, 100% { opacity: .55; transform: translate3d(0, 0, 0); }
    50% { opacity: .9; transform: translate3d(-16px, -16px, 0); }
  }
  @keyframes shineSweep {
    0%, 12% { opacity: 0; transform: translateX(0) rotate(18deg); }
    16% { opacity: 1; }
    24% { opacity: 0; transform: translateX(420%) rotate(18deg); }
    100% { opacity: 0; transform: translateX(420%) rotate(18deg); }
  }
  @keyframes wordReveal {
    0%, 9% { clip-path: inset(0 100% 0 0); opacity: 0; }
    11% { opacity: 1; }
    17%, 100% { clip-path: inset(0 0 0 0); opacity: 1; }
  }
  @keyframes sheen {
    0%, 12% { background-position: 140% 0; }
    22%, 100% { background-position: -40% 0; }
  }
  @keyframes taglineIn {
    0%, 15% { opacity: 0; transform: translateY(6px); }
    19%, 100% { opacity: 1; transform: translateY(0); }
  }
  @keyframes underlineIn {
    0%, 15% { opacity: 0; transform: scaleX(0); }
    21%, 100% { opacity: .95; transform: scaleX(1); }
  }
  @keyframes logIn1 { 0%, 6% { opacity: 0; } 8%, 100% { opacity: 1; } }
  @keyframes logIn2 { 0%, 11% { opacity: 0; } 13%, 100% { opacity: 1; } }
  @keyframes logIn3 { 0%, 16% { opacity: 0; } 18%, 100% { opacity: 1; } }
  @keyframes logIn { 0%, 100% { opacity: 0; } }

  @keyframes floorScroll {
    from { background-position: 0 0, 0 0; }
    to { background-position: 0 64px, 0 0; }
  }
  @keyframes cubeFall {
    from { transform: translate3d(0, 0, 0) rotate(0deg); opacity: var(--o); }
    to { transform: translate3d(var(--dx), 128vh, 0) rotate(var(--rot)); opacity: calc(var(--o) * .4); }
  }
  @keyframes bigIn {
    0%, 34% { clip-path: inset(0 100% 0 0); transform: translateY(0); }
    46%, 64% { clip-path: inset(0 0 0 0); transform: translateY(0); }
    70%, 100% { clip-path: inset(0 0 0 0); transform: translateY(-1.5%); }
  }
  @keyframes bigGlow {
    0%, 34% { opacity: 0; }
    46% { opacity: 1; }
    64% { opacity: .85; }
    100% { opacity: 0; }
  }
  @keyframes neonIn {
    0%, 40% { transform: scaleX(0); opacity: 0; }
    46% { opacity: 1; }
    54%, 64% { transform: scaleX(1); opacity: 1; }
    100% { transform: scaleX(1); opacity: 0; }
  }
  @keyframes sweepDown {
    0%, 32% { opacity: 0; transform: translateY(-30vh); }
    42% { opacity: .9; }
    56% { opacity: 0; transform: translateY(72vh); }
    100% { opacity: 0; transform: translateY(72vh); }
  }
  @keyframes progressIn {
    0%, 2% { opacity: 0; transform: scaleX(0); }
    5% { opacity: .45; }
    28% { opacity: .6; transform: scaleX(.34); }
    34% { opacity: .7; transform: scaleX(.5); }
    64% { opacity: .85; transform: scaleX(.96); }
    70% { opacity: .9; transform: scaleX(1); }
    78%, 100% { opacity: 0; transform: scaleX(1); }
  }
  @keyframes fadeOut {
    0%, 70% { opacity: 0; }
    88%, 100% { opacity: 1; }
  }

  /* 减弱动态效果：保留静态构图，只停掉装饰性运动（不整体隐藏场景） */
  @media (prefers-reduced-motion: reduce) {
    .beam, .ring, .mark-shine, .act1 .grid, .cubes, .sweep, .scanlines, .progress { display: none; }
    .act1, .act2, .emblem, .emblem-glow, .mark, .wordmark, .tagline, .underline,
    .bigline span, .neon-line, .fadeout, .bootlog div, .cyber-floor { animation: none !important; }
    .act1, .act2 { opacity: 1; }
    .bigline span { clip-path: inset(0 0 0 0); }
    .neon-line { transform: scaleX(1); opacity: .9; }
    .underline { transform: scaleX(1); opacity: .9; }
    .cyber-floor { opacity: .55; }
  }
</style>
</head>
<body>
  <div class="stage" id="stage">
    <!-- 第一幕 -->
    <div class="act act1">
      <div class="grid"></div>
      <div class="beam beam-l"></div>
      <div class="beam beam-r"></div>
      <div class="center">
        <div class="emblem">
          <div class="emblem-glow"></div>
          <div class="ring ring-1"></div>
          <div class="ring ring-2"></div>

        <div class="wordmark"><span class="wm-text">KunYu Studio</span></div>
        <div class="tagline">Minecraft Content Studio</div>
        <div class="underline"></div>
      </div>
      <div class="bootlog">
        <div>&gt; init runtime</div>
        <div>&gt; load workspace</div>
        <div>&gt; ready</div>
      </div>

    <!-- 第二幕 -->
    <div class="act act2">
      <div class="cyber-floor"></div>
      <div class="cyber-horizon"></div>
      <div class="sweep"></div>
      <div class="cubes" id="cubes"></div>
      <div class="bigline"><span>世界，由你创造</span></div>
      <div class="neon-line"></div>
      <div class="scanlines"></div>
      <div class="vignette"></div>
    </div>

    <div class="progress"></div>
    <div class="fadeout"></div>

    <div class="hud">
      <button id="btn-replay" title="重播" aria-label="重播">&#8635;</button>
      <button id="btn-full" title="全屏" aria-label="全屏">&#9974;</button>
    </div>
    <div class="hint" id="hint">原型演示 · 点按画面重播</div>
  </div>

<script>
  (function () {
    var stage = document.getElementById('stage');
    var mark = document.getElementById('mark');
    var iconSrc = document.getElementById('icon-src');
    var hint = document.getElementById('hint');
    var params = new URLSearchParams(location.search);
    if (params.has('static')) {
      document.documentElement.classList.add('static-mode');
      document.documentElement.classList.add(
        params.get('static') === '2' ? 'show-act2' : 'show-act1'
      );
    }

    /**
     * 去白底：图标素材是白底方图，直接放在暗色启动画面上会出现刺眼白框。
     * 从四边向内做连通区泛洪，把与外框相连的白色像素置透明，
     * 被角色包围的内部白色（头饰等）保留；边缘像素按亮度做一档羽化。
     */
    function paintKeyed(img) {
      var w = mark.width;
      var h = mark.height;
      var ctx = mark.getContext('2d');
      ctx.clearRect(0, 0, w, h);
      ctx.drawImage(img, 0, 0, w, h);
      var imgData = ctx.getImageData(0, 0, w, h);
      var d = imgData.data;

      function nearWhite(i) {
        var r = d[i], g = d[i + 1], b = d[i + 2];
        var mn = Math.min(r, g, b);
        var mx = Math.max(r, g, b);
        return mn >= 232 && mx - mn <= 20;
      }

      var seen = new Uint8Array(w * h);
      var stack = [];
      var x, y, p;
      for (x = 0; x < w; x++) { stack.push(x, 0, x, h - 1); }
      for (y = 0; y < h; y++) { stack.push(0, y, w - 1, y); }

      var out = new Uint8Array(w * h);
      while (stack.length) {
        var px = stack.pop();
        var py = stack.pop();
        if (px < 0 || py < 0 || px >= w || py >= h) continue;
        p = py * w + px;
        if (seen[p]) continue;
        seen[p] = 1;
        if (!nearWhite(p * 4)) continue;
        out[p] = 1;
        stack.push(px + 1, py, px - 1, py, px, py + 1, px, py - 1);
      }

      for (p = 0; p < w * h; p++) {
        if (out[p]) {
          d[p * 4 + 3] = 0;
          continue;
        }
        var x0 = p % w, y0 = (p - x0) / w;
        if (
          (x0 > 0 && out[p - 1]) || (x0 < w - 1 && out[p + 1]) ||
          (y0 > 0 && out[p - w]) || (y0 < h - 1 && out[p + w])
        ) {
          var mn = Math.min(d[p * 4], d[p * 4 + 1], d[p * 4 + 2]);
          var cut = Math.round((mn / 255) * 118);
          d[p * 4 + 3] = Math.max(0, d[p * 4 + 3] - cut);
        }
      }
      ctx.putImageData(imgData, 0, 0);
    }

    function showKeyed() {
      try {
        if (iconSrc.complete && iconSrc.naturalWidth) {
          paintKeyed(iconSrc);
        } else {
          iconSrc.onload = function () {
            try { paintKeyed(iconSrc); } catch (e) { /* 保留空画布 */ }
          };
        }
      } catch (e) { /* 忽略 */ }
    }

    // 第二幕：方块雨（随机尺寸、速度、漂移与色相）
    function buildCubes() {
      var host = document.getElementById('cubes');
      if (!host) return;
      var n = 30;
      var frag = document.createDocumentFragment();
      for (var i = 0; i < n; i++) {
        var el = document.createElement('div');
        el.className = 'cube' + (Math.random() < 0.22 ? ' is-warm' : '');
        var size = 10 + Math.random() * 34;
        el.style.setProperty('--s', size.toFixed(1) + 'px');
        el.style.setProperty('--o', (0.25 + Math.random() * 0.6).toFixed(2));
        el.style.setProperty('--dx', ((Math.random() - 0.5) * 30).toFixed(1) + 'vw');
        el.style.setProperty('--rot', ((Math.random() - 0.5) * 220).toFixed(0) + 'deg');
        el.style.setProperty('--d', (1.5 + Math.random() * 1.6).toFixed(2) + 's');
        el.style.setProperty('--delay', (-Math.random() * 3).toFixed(2) + 's');
        el.style.setProperty('--st', (Math.random() * 88).toFixed(1) + '%');
        el.style.left = (Math.random() * 100).toFixed(2) + '%';
        frag.appendChild(el);
      }
      host.appendChild(frag);
    }

    // 大字自适应：不同窗口宽度下压到可用宽度内，避免「造」被裁
    function fitBigline() {
      var span = document.querySelector('.bigline span');
      if (!span) return;
      span.style.fontSize = '';
      var wrap = span.parentElement;
      var avail = wrap.clientWidth - 24;
      var fs = parseFloat(getComputedStyle(span).fontSize);
      var guard = 0;
      while (span.scrollWidth > avail && fs > 18 && guard++ < 80) {
        fs -= 2;
        span.style.fontSize = fs + 'px';
      }
    }

    function restart() {
      if (document.getAnimations) {
        document.getAnimations().forEach(function (a) {
          try { a.cancel(); a.play(); } catch (e) {}
        });
      }
      hint.classList.remove('is-hidden');
    }

    function anyTap() {
      restart();
      hint.classList.add('is-hidden');
      clearTimeout(hintTimer);
    }

    document.getElementById('btn-replay').addEventListener('click', function (e) {
      e.stopPropagation(); anyTap();
    });
    document.getElementById('btn-full').addEventListener('click', function (e) {
      e.stopPropagation();
      try {
        if (!document.fullscreenElement && stage.requestFullscreen) stage.requestFullscreen();
        else if (document.exitFullscreen) document.exitFullscreen();
      } catch (err) {}
    });
    stage.addEventListener('click', anyTap);

    var hintTimer = setTimeout(function () { hint.classList.add('is-hidden'); }, 6000);

    showKeyed();
    buildCubes();
    fitBigline();
    window.addEventListener('resize', fitBigline);

    // 调试：?freeze=4200 用负延迟把动画定格在周期内某一毫秒，便于截图核对
    if (params.has('freeze')) {
      var atMs = Number(params.get('freeze')) || 0;
      Array.prototype.forEach.call(document.querySelectorAll('*'), function (el) {
        var cs = getComputedStyle(el);
        if (cs.animationName && cs.animationName !== 'none') {
          el.style.animationPlayState = 'paused';
          el.style.animationDelay = '-' + (atMs / 1000) + 's';
        }
      });
    }
  })();
</script>
