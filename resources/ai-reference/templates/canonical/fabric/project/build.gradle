// ============================================================================
// KunYuEcosystem AI Reference v3.0 | fabric/{{mcVersion}}/project/build.gradle | mapping: Yarn | provenance: extracted verbatim from source PDF; Chinese annotations unrecoverable (no ToUnicode)
// ============================================================================
// ============================================================================
// build.gradle —— Fabric {{mcVersion}} Groovy DSL
// ============================================================================
//  -  Fabric  example mod  {{mcVersion}}
//  -  gradle.properties
//  - JDK {{jdk}} + Gradle 8.x 8.6
// ============================================================================
plugins {
    // Fabric LoomFabric  Gradle  Minecraft
    // Yarn runClient/runServerremap
    // {{loomVersion}}  settings.gradle  Fabric Maven
    id 'fabric-loom' version '{{loomVersion}}'
    // maven-publish Maven  publishing
    id 'maven-publish'
}
version = project.mod_version
group = project.maven_group
base {

    //  jar  Gradle  project.name
    // project.name  settings.gradle  rootProject.name  examplemod
    archivesName = project.name
}
repositories {
    // Loom  FabricMojang  Maven Central
    // / Mod MenuRibbon  maven
    // maven { url = 'https://maven.terraformersmc.com/' }
    mavenCentral()
}
// ----------------------------------------------------------------------------
//  gradle.properties
// ----------------------------------------------------------------------------
dependencies {
    // Minecraft  jar
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    // Yarn  :v2 /
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    // Fabric Loader
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    // Fabric API
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}
// ----------------------------------------------------------------------------
//  gradle.properties  mod_version  fabric.mod.json
// ----------------------------------------------------------------------------
processResources {
    inputs.property "version", project.version
    //  fabric.mod.json  ${version}
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}
// ----------------------------------------------------------------------------
// Minecraft {{mcVersion}}  Java {{jdk}}
// ----------------------------------------------------------------------------
tasks.withType(JavaCompile).configureEach {
    it.options.release = {{jdk}}
}
java {
    //  sources jar
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_{{jdk}}
    targetCompatibility = JavaVersion.VERSION_{{jdk}}
}
// ----------------------------------------------------------------------------
// jar  LICENSE  jar
// ----------------------------------------------------------------------------
jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}
