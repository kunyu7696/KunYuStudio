# KunYuEcosystem AI Reference 模板迁移（forge/1.20.1 -> forge/1.18.2）
# provenance: translated-from-forge-1.20.1
# 目标 loader=forge mc=1.18.2 loaderVersion=40.2.0
# 注意：本文件由脚本从种子组合复制并替换版本号得到。Java API、Yarn/Mojmap 命名、
#       加载器 DSL 在 1.18.2 上可能与种子版本存在差异，构建失败时
#       请优先查阅 1.18.2 官方文档/Forge docs。
# verifiedAt 为 null 表示本模板尚未在目标版本真机编译验证。

# ============================================================================
# KunYuEcosystem AI Reference v3.2 | forge/1.18.2/project/mods.toml | mapping: Mojang official | provenance: adapted from official loader MDK/docs
# ============================================================================
# 用法要点：
# - 实际位置：src/main/resources/META-INF/mods.toml。
# - modLoader=javafml 表示 Java 代码模组；loaderVersion 匹配 Forge 主版本 47。
# - [[mods]] 段声明 modId/version/displayName/description；
#   [[dependencies.<modId>]] 声明对 forge 与 minecraft 的版本约束。
# - 使用 Mixin 时追加 [[mixins]] config="examplemod.mixins.json"。
# ============================================================================
modLoader="javafml"
loaderVersion="[40,)"
license="MIT"
#issueTrackerURL="https://github.com/example/examplemod/issues"

[[mods]]
modId="examplemod"
version="1.0.0"
displayName="Example Mod"
description='''
KunYuEcosystem AI reference scaffold for Forge 1.18.2.
'''
authors="Example Author"
#logoFile="assets/examplemod/logo.png"

[[dependencies.examplemod]]
    modId="forge"
    mandatory=true
    versionRange="[40,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.examplemod]]
    modId="minecraft"
    mandatory=true
    versionRange="[1.18.2,1.19)"
    ordering="NONE"
    side="BOTH"

# 如使用 Mixin，取消注释并把 examplemod.mixins.json 放入 src/main/resources：
# [[mixins]]
# config="examplemod.mixins.json"
