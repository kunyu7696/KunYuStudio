// ============================================================================
// KunYuEcosystem AI Reference v3.0 | fabric/1.21.10/project/build.gradle | mapping: Yarn | provenance: extracted verbatim from source PDF; Chinese annotations unrecoverable (no ToUnicode)
// ============================================================================
// ============================================================================
// build.gradle —— Fabric 1.21.10 Groovy DSL
// ============================================================================
//  -  Fabric  example mod  1.21.10
//  -  gradle.properties
//  - JDK 21 + Gradle 8.x 8.6
// ============================================================================
plugins {
    // Fabric LoomFabric  Gradle  Minecraft
    // Yarn runClient/runServerremap
    // 1.18.4  settings.gradle  Fabric Maven
    id 'fabric-loom' version '1.18.4'
    // maven-publish Maven  publishing
    id 'maven-publish'
}
version = project.mod_version
group = project.maven_group
base {

    //  jar  Gradle  project.name
    // project.name  settings.gradle  rootProject.name  examplemod
    archivesName = project.name
}
repositories {
    // Loom  FabricMojang  Maven Central
    // / Mod MenuRibbon  maven
    // maven { url = 'https://maven.terraformersmc.com/' }
    mavenCentral()
}
// ----------------------------------------------------------------------------
//  gradle.properties
// ----------------------------------------------------------------------------
dependencies {
    // Minecraft  jar
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    // Yarn  :v2 /
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    // Fabric Loader
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    // Fabric API
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}
// ----------------------------------------------------------------------------
//  gradle.properties  mod_version  fabric.mod.json
// ----------------------------------------------------------------------------
processResources {
    inputs.property "version", project.version
    //  fabric.mod.json  ${version}
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}
// ----------------------------------------------------------------------------
// Minecraft 1.21.10  Java 21
// ----------------------------------------------------------------------------
tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}
java {
    //  sources jar
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}
// ----------------------------------------------------------------------------
// jar  LICENSE  jar
// ----------------------------------------------------------------------------
jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}
