// ============================================================================
// KunYuEcosystem AI Reference v3.0 | fabric/26.3/project/build.gradle | mapping: Yarn | provenance: extracted verbatim from source PDF; Chinese annotations unrecoverable (no ToUnicode)
// ============================================================================
// ============================================================================
// build.gradle —— Fabric 26.3 Groovy DSL
// ============================================================================
//  -  Fabric  example mod  26.3
//  -  gradle.properties
//  - JDK 25 + Gradle 8.x 8.6
// ============================================================================
plugins {
    // Fabric LoomFabric  Gradle  Minecraft
    // Mojang 官方映射 runClient/runServerremap（26.x 无 Yarn）
    // 1.18-SNAPSHOT  settings.gradle  Fabric Maven
    id 'fabric-loom' version '1.18-SNAPSHOT'
    // maven-publish Maven  publishing
    id 'maven-publish'
}
version = project.mod_version
group = project.maven_group
base {

    //  jar  Gradle  project.name
    // project.name  settings.gradle  rootProject.name  examplemod
    archivesName = project.name
}
repositories {
    // Loom  FabricMojang  Maven Central
    // / Mod MenuRibbon  maven
    // maven { url = 'https://maven.terraformersmc.com/' }
    mavenCentral()
}
// ----------------------------------------------------------------------------
//  gradle.properties
// ----------------------------------------------------------------------------
dependencies {
    // Minecraft  jar
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    // 26.x 起 Yarn 无构建：Loom 1.18 默认 Mojang 官方映射，无需 mappings 行
    // Fabric Loader
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    // Fabric API
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}
// ----------------------------------------------------------------------------
//  gradle.properties  mod_version  fabric.mod.json
// ----------------------------------------------------------------------------
processResources {
    inputs.property "version", project.version
    //  fabric.mod.json  ${version}
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}
// ----------------------------------------------------------------------------
// Minecraft 26.3  Java 25
// ----------------------------------------------------------------------------
tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}
java {
    //  sources jar
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}
// ----------------------------------------------------------------------------
// jar  LICENSE  jar
// ----------------------------------------------------------------------------
jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}
