name: CI

on:
  push:
    # 实际分支是 master，此前写 [main] 导致 push 型 CI 永不命中
    branches: [master]
  pull_request:
  schedule:
    # 每周一 03:23 UTC 跑一次矩阵门禁（真实构建耗时长，不随 PR 触发）。
    # 原为 0 3 * * 1，与 matrix-refresh 的每日 03:00 同刻；GitHub 调度在高负载下会
    # 延迟/丢弃事件——实测该 workflow 自 10/28 起 schedule_total=0，而 nightly、
    # matrix-refresh 均有调度记录。改为错峰分钟，避开整点与同刻冲突。
    - cron: '23 3 * * 1'
  workflow_dispatch:
    inputs:
      combos:
        description: '只跑指定组合（逗号分隔，如 fabric-1.21.11）；留空 = 跑全量分层'
        required: false
        default: ''

# Unix LF 换行符必须保留：Windows CRLF 会导致 YAML 解析错误（项目硬约束）
jobs:
  # 三平台门禁：代码已是跨平台形态（win32 专属逻辑均有 platform 守卫/分支），
  # typecheck/lint/单测在三个系统上都跑，防止某个平台专属回归混进 master。
  # 覆盖率门槛只在 Windows 跑（平台条件测试 runIf 跳过会影响计数，不与覆盖率耦合）。
  gate:
    name: 质量门禁（typecheck + 单测，${{ matrix.os }}）
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # electron 44 起无 postinstall：npm ci 后无 path.txt，首次 require('electron')
      # 惰性 spawnSync 下载 ~100MB 二进制并冻结事件循环——CI 冷缓存下 vitest 墙钟判
      # 5s 测试超时，多 worker 并发下载还互踩 dist 解压目录（2026-10-26/27 三轮 master
      # 红的共同根因）。单测从不启动 electron，预置存在性桩即可掐断下载链路。
      - name: 预置 electron 二进制桩
        run: node scripts/stub-electron-binary.cjs

      - name: typecheck（node 侧）
        run: npm run typecheck:node

      - name: typecheck（web 侧）
        run: npm run typecheck:web

      - name: lint（.ts + .vue）
        run: npm run lint

      - name: 单元测试
        # npm run test 经 run-vitest.cjs 透传退出码：非 0 即本步骤失败（显式退出码门禁，
        # 不允许"摘要全绿但 exit 1"的静默 flake 混过 CI）
        run: npm run test

      - name: 覆盖率门槛（services 层，仅 Windows）
        if: matrix.os == 'windows-latest'
        run: npm run test:coverage

      - name: 产物新鲜度门禁（out/ 不落后于 src）
        # assert-out-fresh 此前只挂在本机 build:win，CI 从不执行。
        # 这里跑 electron-vite build 后断言 out/（main+renderer mtime 门 + 判别串门）；
        # 打包级验证（app.asar 一致性）仍留在本地 build:win 的 verify-dist-freshness。
        run: |
          npm run build
          node scripts/assert-out-fresh.cjs

  matrix-pr:
    name: 矩阵门禁（compileJava + processResources + jar，2-6 分钟/组合）
    # push 直推 master 也必须过编译门禁，不再只认 PR；
    # push 档只跑 core 档控制时长，PR 档 core+extended 全量
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21
            25

      # Gradle 发行包 + 依赖的冷下载是本门禁唯一的抖动源（neoforge 还要从
      # maven.neoforged.net 拉 NeoForm runtime，单次失败实测 13 分钟连接超时）。
      # 缓存按 MDK 快照做 key：工具链坐标不变就不重下。
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('src/main/templates/mdkSnapshot.json') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - run: npm ci

      - name: PR/push 轻量矩阵（compileJava + processResources + jar，不写回 manifest）
        shell: pwsh
        env:
          KY_MATRIX_TIERS: ${{ github.event_name == 'push' && 'core' || 'core,extended' }}
        run: |
          # 同一 commit 出现过一绿一红（下载链抖动），失败自动重试一次；两次都红才判失败。
          # 失败组合写进步骤摘要：无需下载日志即可定位是哪条组合挂了。
          function Invoke-Gate([string]$log) {
            # 末尾 Write-Host 把管道输出交给宿主，避免混进函数返回值导致 $ec 变成数组
            npm run test:matrix-pr *>&1 | Tee-Object -FilePath $log | Write-Host
            return $LASTEXITCODE
          }
          $log1 = Join-Path $env:RUNNER_TEMP 'matrix-pr-1.log'
          $ec = Invoke-Gate $log1
          $log = $log1
          if ($ec -ne 0) {
            Write-Host "::warning::首次矩阵门禁失败（exit $ec），重试一次"
            $log2 = Join-Path $env:RUNNER_TEMP 'matrix-pr-2.log'
            $ec = Invoke-Gate $log2
            if (Test-Path $log2) { $log = $log2 }
          }
          if ($ec -ne 0) {
            '## 矩阵门禁失败组合' | Add-Content -Path $env:GITHUB_STEP_SUMMARY -Encoding utf8
            Select-String -Path $log -Pattern '×.*@' |
              ForEach-Object { '- ' + $_.Line.Trim() } |
              Add-Content -Path $env:GITHUB_STEP_SUMMARY -Encoding utf8
          }
          exit $ec

  matrix-gate:
    name: 矩阵门禁（core/extended/legacy 真机构建）
    # 全部 35 个「加载器 × MC 版本」组合各跑一次 gradlew build，只随定时/手动触发
    # （forge-1.16.5 已冻结，不在构建矩阵内、仅存 manifest 指纹）；
    # legacy 三个遗产版本（1.16.5/1.18.2/1.19.2，fabric/forge 共 5 组合）
    # 修复后纳入门禁，不再永绝于编译验证之外
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    # matrixHealth 落回仓库 manifest 需要 push 权限；失败诊断要在 issue 里留痕
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 矩阵 core/extended 组合需要 JDK 17 / 21 / 25（26.x 起 Mojang 交付 Java 25）三种编译宿主
      # （setup-java 写入 JAVA_HOME_17_X64 / JAVA_HOME_21_X64 / JAVA_HOME_25_X64）
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21
            25

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('src/main/templates/mdkSnapshot.json') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - run: npm ci

      - name: 矩阵真实构建（结果写入统一存储 overlay）
        id: matrix
        shell: pwsh
        env:
          KY_MATRIX_TIERS: core,extended,legacy
          # 定向复跑（诊断用）：填 fabric-1.21.11 之类的组合名则只跑该组合
          KY_MATRIX_COMBOS: ${{ github.event.inputs.combos }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'matrix-gate.log'
          npm run test:matrix *>&1 | Tee-Object -FilePath $log | Write-Host
          $ec = $LASTEXITCODE
          if ($ec -eq 0) { exit 0 }

          # 失败诊断：无人订阅 CI 时 job 红等于静默；把 vitest 失败段写进步骤摘要 + issue，
          # 无需下载日志即可定位是哪个组合、什么错。
          $text = Get-Content $log -Raw
          $i = $text.IndexOf('Failed Tests')
          $excerpt = if ($i -ge 0) { $text.Substring($i) } else { $text.Substring([Math]::Max(0, $text.Length - 8000)) }
          if ($excerpt.Length -gt 9000) { $excerpt = $excerpt.Substring(0, 9000) }
          $body = "矩阵门禁失败（commit $env:GITHUB_SHA）。`n运行：$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID`n`n$excerpt"
          $body | Add-Content -Path $env:GITHUB_STEP_SUMMARY -Encoding utf8
          $existing = gh issue list --state open --search "矩阵门禁失败 in:title" --json number --jq '.[0].number'
          if ($existing) {
            gh issue comment "$existing" --body $body
          } else {
            gh issue create --title '矩阵门禁失败（真机构建）' --body $body
          }
          exit $ec

      # 失败 issue 只在失败时创建；恢复后自动关闭，避免积压僵尸 issue。
      # 定向复跑（combos 非空）不关：部分组合通过不代表基线恢复。
      - name: 门禁恢复 → 自动关闭失败追踪 issue
        if: success() && github.event.inputs.combos == ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          $existing = gh issue list --state open --search "矩阵门禁失败 in:title" --json number --jq '.[0].number'
          if ($existing) {
            $body = "门禁已恢复通过（commit $env:GITHUB_SHA）。`n运行：$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            gh issue close "$existing" --comment $body
            Write-Host "已关闭失败追踪 issue #$existing"
          }

      # 定向复跑（combos 非空）不写回仓库：只用于诊断单个组合，避免部分结果覆盖基线
      - name: matrixHealth 快照导出 manifest
        if: always() && github.event.inputs.combos == ''
        run: node scripts/exportMatrixHealth.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: matrix-manifest
          path: resources/ai-reference/manifest.json

      - name: matrixHealth 落回仓库 manifest
        # 此前结果只随 artifact 上传，仓库内 matrixHealth 永久停在最后一次本机运行。
        # 回写在 test:matrix 内部完成（writeBackMatrixHealth），这里把变更提交回触发分支。
        # 若无变更（如环境性失败未回写）则 git diff --quiet 短路，push 为 no-op。
        if: always() && github.event.inputs.combos == ''
        run: |
          git config user.name "kunyu-ci-bot"
          git config user.email "actions@users.noreply.github.com"
          git add resources/ai-reference/manifest.json
          git diff --cached --quiet || git commit -m "chore(matrix): 定时真机构建刷新 matrixHealth"
          git push
