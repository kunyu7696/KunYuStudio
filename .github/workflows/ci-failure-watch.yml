name: CI 失败守夜

# 0 star 项目没人订阅 Actions 通知：CI 红了会一直红，没人知道。
# 这里每天检查 master 上最近 3 个自然日（北京时间）的 CI 结论，
# 连续 3 天都是失败就在 issue 里留痕；已有同名 open issue 时改为追加评论，避免刷屏。
# CI 恢复后不会自动关闭 issue，需人工确认后手动关闭。
on:
  schedule:
    # 每天 01:00 UTC（北京时间 09:00）
    - cron: '0 1 * * *'
  workflow_dispatch:
  # 自检：本文件改动后立刻跑一次，改完当天就能确认通不通，不必等次日 01:00
  push:
    paths:
      - '.github/workflows/ci-failure-watch.yml'

jobs:
  watch:
    name: 检查 CI 连续失败
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # gh run list 走 Actions API，必须显式给 actions: read（未声明的作用域一律为 none）
      actions: read
      issues: write
    # 本 job 不 checkout，工作区没有 .git，gh 无法自行推断仓库；
    # 不显式给 GH_REPO 时 gh run list 会直接以「not a git repository」失败。
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - name: 统计最近 3 个自然日的 CI 结论
        id: check
        shell: bash
        env:
          # push 自检：强制命中，用来演练「开 issue」分支（该分支只做只读查询，不落 issue）
          FORCE_HIT: ${{ github.event_name == 'push' }}
        run: |
          set -euo pipefail

          # 只取 master 上的运行：PR 触发的运行 head 分支是特性分支，天然被 --branch 过滤掉
          gh run list --workflow=ci.yml --branch=master --limit=100 \
            --json createdAt,conclusion,url > /tmp/runs.json

          # 按北京时间（UTC+8）切日，每天取最近一次运行的结论
          STATS=$(jq -c '
            map({ day: (.createdAt | fromdateiso8601 + 28800 | strftime("%Y-%m-%d")), createdAt, conclusion, url })
            | sort_by(.createdAt)
            | group_by(.day)
            | map(sort_by(.createdAt) | { day: .[0].day, conclusion: .[-1].conclusion, url: .[-1].url })
            | sort_by(.day)
            | .[-3:]
          ' /tmp/runs.json)

          # 命中条件：恰好 3 天、三天全 failure、且首尾日期相差正好 2 天（中间无断档）
          HIT=$(echo "$STATS" | jq -r '
            if length == 3
               and (map(select(.conclusion == "failure")) | length) == 3
               and ((((.[2].day + "T00:00:00Z") | fromdateiso8601) - ((.[0].day + "T00:00:00Z") | fromdateiso8601)) == 172800)
            then "true" else "false" end
          ')

          echo "$STATS" | jq -r '.[] | "- \(.day)：\(.conclusion)（\(.url)）"' > /tmp/detail.md
          cat /tmp/detail.md
          if [ "$FORCE_HIT" = "true" ]; then HIT=true; fi
          echo "连续 3 天失败：$HIT"
          echo "hit=$HIT" >> "$GITHUB_OUTPUT"

      # 自检：强制命中后走一遍正文渲染 + issue 查询，但不创建/评论，避免污染真实 issue
      - name: 自检演练（强制命中，只读）
        if: steps.check.outputs.hit == 'true' && github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          echo "=== 自检：命中分支演练（不会创建/评论 issue）==="
          cat /tmp/detail.md
          echo "--- 现有同名 open issue（只读查询）---"
          gh issue list --state open --search "CI 连续 3 天失败 in:title" --json number,title
          echo "自检通过：命中判定、正文渲染、issue 查询均可用。"

      - name: 连续失败自动开 issue
        if: steps.check.outputs.hit == 'true' && github.event_name != 'push'
        shell: bash
        run: |
          set -euo pipefail
          TITLE='[自动化] CI 连续 3 天失败'
          BODY=$(printf '%s\n' \
            "master 上的 CI 已经连续 **3 个自然日**（北京时间）失败，请尽快排查。" \
            "" \
            "$(cat /tmp/detail.md)" \
            "" \
            "常见排查顺序：" \
            "- 三平台质量门禁：typecheck（node/web）/ lint / 单测 / 产物新鲜度，先看失败 job 的日志" \
            "- Windows 专属：CRLF 换行、路径分隔符、覆盖率门槛" \
            "- 矩阵门禁：compileJava / processResources / jar" \
            "" \
            "本次检查：$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            "" \
            "CI 恢复后请关闭本 issue；本工作流不会自动关闭。")
          EXISTING=$(gh issue list --state open --search "CI 连续 3 天失败 in:title" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
            echo "已在 issue #$EXISTING 追加评论"
          else
            gh issue create --title "$TITLE" --body "$BODY"
            echo "已新建 issue"
          fi

      # 兜底：CI 的 schedule 曾出现「配置正确但从未被调度」（schedule_total=0），
      # 这种情况下没有任何 run 会变红，守夜也看不到。矩阵健康度的 lastVerifiedAt
      # 是全量门禁成功回写的直接证据，超期即视为「全量矩阵没有真正跑过」。
      - name: 检查矩阵健康度新鲜度（全量门禁）
        id: freshness
        shell: bash
        env:
          MAX_AGE_DAYS: '8'
          # push 自检：强制命中，演练「矩阵过期」分支（只读查询，不落 issue）
          FORCE_STALE: ${{ github.event_name == 'push' }}
        run: |
          set -euo pipefail
          NEWEST=$(jq -r '[.versionFingerprints[].matrixHealth.lastVerifiedAt // empty] | max // ""' resources/ai-reference/manifest.json)
          NOW=$(date -u +%s)
          if [ -z "$NEWEST" ]; then
            echo "manifest 中没有任何 matrixHealth 记录（全量门禁从未成功回写）"
            DAYS=999
          else
            THEN=$(date -u -d "$NEWEST" +%s)
            DAYS=$(( (NOW - THEN) / 86400 ))
            echo "最近一次全量矩阵真机构建：$NEWEST（$DAYS 天前）"
          fi
          STALE=false
          if [ "$DAYS" -ge "$MAX_AGE_DAYS" ]; then STALE=true; fi
          if [ "$FORCE_STALE" = "true" ]; then STALE=true; fi
          echo "阈值：${MAX_AGE_DAYS} 天；判定 stale=$STALE"
          echo "stale=$STALE" >> "$GITHUB_OUTPUT"
          echo "newest=$NEWEST" >> "$GITHUB_OUTPUT"
          echo "days=$DAYS" >> "$GITHUB_OUTPUT"

      - name: 自检演练（矩阵新鲜度，只读）
        if: steps.freshness.outputs.stale == 'true' && github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          echo "=== 自检：矩阵健康度过期命中（不会创建/评论 issue）==="
          echo "最近一次回写：${{ steps.freshness.outputs.newest }}（${{ steps.freshness.outputs.days }} 天前）"
          echo "--- 现有同名 open issue（只读查询）---"
          gh issue list --state open --search "矩阵健康度超过 8 天未刷新 in:title" --json number,title
          echo "自检通过：新鲜度判定、正文渲染、issue 查询均可用。"

      - name: 矩阵健康度过期自动开 issue
        if: steps.freshness.outputs.stale == 'true' && github.event_name != 'push'
        shell: bash
        run: |
          set -euo pipefail
          TITLE='[自动化] 矩阵健康度超过 8 天未刷新'
          NEWEST='${{ steps.freshness.outputs.newest }}'
          DAYS='${{ steps.freshness.outputs.days }}'
          if [ -z "$NEWEST" ]; then
            LATEST='manifest 中没有任何 matrixHealth 记录'
          else
            LATEST="最近一次全量矩阵真机构建：$NEWEST（$DAYS 天前）"
          fi
          BODY=$(printf '%s\n' \
            "仓库 manifest 的矩阵健康度已经超过 **8 天**没有刷新，说明全量 matrix-gate 没有成功运行/回写。" \
            "" \
            "- $LATEST" \
            "- 判定口径：versionFingerprints[].matrixHealth.lastVerifiedAt 的最大值" \
            "" \
            "排查顺序：" \
            "1. Actions → CI → 是否有 schedule 或 workflow_dispatch 的全量矩阵运行（combos 留空）" \
            "2. 若 cron 未触发：确认默认分支为 master、workflow 处于 active；必要时手动 dispatch 一次全量" \
            "3. 若矩阵运行失败：看 matrix-gate job 日志；环境性失败（Gradle/镜像 504）重试即可" \
            "" \
            "本次检查：$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            "" \
            "全量门禁恢复后请关闭本 issue；本工作流不会自动关闭。")
          EXISTING=$(gh issue list --state open --search "矩阵健康度超过 8 天未刷新 in:title" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
            echo "已在 issue #$EXISTING 追加评论"
          else
            gh issue create --title "$TITLE" --body "$BODY"
            echo "已新建 issue"
          fi
