version: 2
updates:
  # 生产/开发 npm 依赖：每周一检查（与矩阵门禁同频，避免补丁版本积压）
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
      # vitest 生态联动：vitest 与 @vitest/coverage-v8 版本必须严格对齐
      # （coverage 的 peerDependencies 锁死同名版本），单独升任一个必然 npm ci 失败
      vitest:
        patterns:
          - vitest
          - '@vitest/*'
    ignore:
      # 一刀切：所有依赖的大版本升级不自动提 PR，由人工统一升级。
      # 原因：构建链互相锁 peer / Node 下限，bot 逐个升级只会产出必然失败的
      # 孤立 PR（实测：typescript 7 被 @typescript-eslint peer <6.1.0 拦截；
      # npm 12 要求 Node ^22.22；vite 8 被 electron-vite 5 peer 拦截）。
      # 升级时临时注释本条，一次性改齐 peer 组合后再恢复。
      - dependency-name: '*'
        update-types:
          - version-update:semver-major

  # GitHub Actions 版本跟进（actions/checkout、setup-node 等）
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # 与 npm 同理：actions 大版本由人工统一升级（checkout/setup-node/upload-artifact
      # 等大版本跳跃需人工核对 breaking changes，bot PR 在旧仓库均关闭未合并）
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
